[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psx-desk"
version = "1.0.0"
description = "Autonomous PSX-only multi-agent trading desk (Pakistan Stock Exchange, Karachi)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["psx", "pakistan-stock-exchange", "langgraph", "multi-agent", "equity-research", "karachi"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    # Typed contracts for every node (structured output).
    "pydantic>=2.7",
    # LangGraph state machine + LangChain message plumbing.
    "langgraph>=0.2.60",
    "langchain-core>=0.3.20",
    # Official Google Gen AI SDK (the default structured-output backend).
    "google-genai>=1.0",
    # Scraping PSX: requests + a keep-alive pool; pandas for vectorised indicators.
    "requests>=2.32",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Alternate structured-output backend via langchain chat models.
langchain = [
    "langchain-google-genai>=2.0",
]
openai = ["langchain-openai>=0.2"]
anthropic = ["langchain-anthropic>=0.2"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
psx-desk = "psx_desk.cli:main"

[tool.setuptools.packages.find]
include = ["psx_desk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "unit: fast, hermetic tests driven by recorded PSX payloads",
    "integration: tests that would touch psx.com.pk / sbp.org.pk (never run by default)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["var"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/*" = ["B011"]
