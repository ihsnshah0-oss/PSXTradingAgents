name: Release assets

# Builds the sdist and wheel for a tagged release and attaches them to it, so the
# desk can be installed without cloning:
#   pip install https://github.com/<owner>/<repo>/releases/download/<tag>/psx_desk-<version>-py3-none-any.whl
# Run it by hand with a tag to attach builds to an earlier release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach, for example v1.0.0"
        required: true

permissions: {}

concurrency:
  group: release-assets-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build and attach
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Attach to the release
        run: gh release upload "$TAG" dist/* --clobber
